# Server Configuration
server.port=9085
# Local PostgresSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/dormitory_db;
spring.datasource.username=postgres
spring.datasource.password=admin@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration
spring.mvc.cors.allowed-origins=http://localhost:4200
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Bed Pricing Configuration (per hour)
dormitory.bed.hourly-rate=5.00
dormitory.bed.daily-rate=50.00
